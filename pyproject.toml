[project]
name = "clinstagram"
version = "0.4.0"
description = "Let your AI agent run your Instagram: post, reply, DMs, insights and multiple accounts from one CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "instagrapi>=3.2.2; python_version >= '3.11'",
    "instagrapi>=2.2.0; python_version < '3.11'",
    "rich>=13.7.0",
    "packaging>=23.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "pydantic>=2.6.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
clinstagram = "clinstagram.entry:run"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "SKILL.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/clinstagram"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "clinstagram/SKILL.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
